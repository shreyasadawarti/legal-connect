services:
  - type: web
    name: legal-connect-backend
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: "pip install -r requirements.txt"
    # Alembic owns the schema; AUTO_CREATE_TABLES is false in production.
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    rootDir: backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      # MySQL must be a host reachable from the cloud -- the developer's local
      # MySQL instance is not. Set these to a managed provider (Railway,
      # PlanetScale, Aiven, or similar) before deploying.
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: legal_connect
      - key: MYSQL_CHARSET
        value: utf8mb4
      # Schema is managed by Alembic, not create_all, in production.
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: RESEND_API_KEY
        sync: false
